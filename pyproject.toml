[project]
name = "lector"
version = "0.1.0"
description = "Read text aloud with high-quality neural TTS (Kokoro) — from clipboard, stdin, or argument."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "kokoro-onnx>=0.4.0",
    "sounddevice>=0.5",
    "typer>=0.15",
    "rich>=13",
]

[project.scripts]
lector = "lector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PLC",    # pylint convention
    "PLE",    # pylint error
    "PLW",    # pylint warning
    "RUF",    # ruff-specific rules
    "D",      # pydocstyle
]
ignore = [
    "D100",   # missing docstring in public module (enforced by review)
    "D104",   # missing docstring in public package
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",      # docstrings optional in tests
    "SLF001", # private member access is fine in tests
    "ARG",    # unused arguments (fixtures)
]
"src/lector/macos_service.py" = [
    "E501",   # plist XML template has long lines that cannot be broken
]

[tool.ruff.lint.isort]
known-first-party = ["lector"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "deal>=4.24.6",
    "hypothesis>=6.151.9",
]
